[project]
name = "cli-svckit"
version = "0.0.0"
description = "Toolkit for CLIs that ship local services: lifecycle, CLI install, a JSON contract and restart/update coordination."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ejlevin1" }]
keywords = ["launchd", "systemd", "services", "cli", "typer", "coordination"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
typer = ["typer>=0.12", "rich>=13"]
rich = ["rich>=13"]

[project.urls]
Homepage = "https://github.com/ejlevin1/cli-svckit"
Issues = "https://github.com/ejlevin1/cli-svckit/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_svckit"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
