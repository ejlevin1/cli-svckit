name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv run --locked -p ${{ matrix.python }} pytest -q
      - run: uv run --locked -p ${{ matrix.python }} ruff check

  public-check:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          v="$GITLEAKS_VERSION"; base="https://github.com/gitleaks/gitleaks/releases/download/v${v}"
          cd "$RUNNER_TEMP"
          curl -sSfLO "${base}/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${v}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${v}_checksums.txt"
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: scripts/check-public.sh --all
      - run: scripts/check-public.sh --history
